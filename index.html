<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select a Course</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f1f1f1;
      }
      header {
        background-color: #4caf50;
        color: white;
        padding: 15px;
        text-align: center;
      }
      .container {
        max-width: 800px;
        margin: 50px auto;
        text-align: center;
        background-color: white;
        padding: 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        margin-bottom: 30px;
      }
      .course {
        display: inline-block;
        margin: 20px;
      }
      .course button {
        padding: 15px 30px;
        background-color: #4caf50;
        color: white;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      .course button:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Select a Course</h1>
    </header>

    <div class="container">
      <h2>Choose a course to get started:</h2>

      <div class="course">
        <button onclick="window.location.href='java_course.html'">Java</button>
      </div>
      <div class="course">
        <button onclick="window.location.href='python_course.html'">
          Python
        </button>
      </div>
      <div class="course">
        <button onclick="window.location.href='dotnet_course.html'">
          .NET
        </button>
      </div>
    </div>
  </body>
</html>
